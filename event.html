<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHAKSHUKA TRAVEL • Event</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html">← All events</a>
    <div class="brand-small">SHAKSHUKA TRAVEL</div>

    <div id="participantSessionIndicator" class="participant-session-indicator hidden">
      <span class="participant-session-dot" aria-hidden="true"></span>
      <div>
        <strong>Logged in</strong>
        <span id="participantSessionName"></span>
      </div>
      <button id="participantSignOut" class="ghost-button compact-button" type="button">Exit</button>
    </div>
  </header>

  <main class="page">
    <div id="status" class="status">Loading event…</div>

    <section id="participantLoginScreen" class="participant-login-screen hidden">
      <div class="participant-login-card">
        <div class="eyebrow">SHAKSHUKA TRAVEL</div>
        <h1 id="loginEventName">Participant login</h1>
        <p class="participant-login-subtitle">
          Select your name and enter your phone number to access this event.
        </p>

        <label class="field">
          <span>Your name</span>
          <select id="participantSelect">
            <option value="">Loading participants…</option>
          </select>
        </label>

        <label class="field">
          <span>Phone number</span>
          <input
            id="participantPhone"
            type="tel"
            autocomplete="tel"
            placeholder="05X-XXXXXXX"
          />
        </label>

        <div id="participantLoginStatus" class="status compact-status hidden"></div>

        <button id="participantSignIn" class="primary-button participant-login-submit" type="button">
          Enter my event
        </button>
      </div>
    </section>

    <article id="event" class="event-detail hidden">
      <div class="event-detail__top">
        <div>
          <div id="eventDates" class="date-large"></div>
          <h1 id="eventName"></h1>
          <div id="eventLocation" class="location"></div>
        </div>
      </div>

      <div class="detail-grid">
        <section class="panel">
          <h3>Event information</h3>
          <p id="eventDescription"></p>
        </section>

        <section class="panel">
          <h3>Location</h3>
          <p id="eventVenue"></p>
          <p id="eventLocationInfo"></p>
        </section>

        <section class="panel detail-panel-wide">
          <h3>Useful links</h3>
          <div id="eventLinks"></div>
        </section>
      </div>

      <section class="panel participant-dashboard-panel">
        <div class="participant-welcome">
          <div>
            <div class="eyebrow">PARTICIPANT</div>
            <h3 id="participantWelcomeName">Welcome</h3>
          </div>
        </div>

        <div class="participant-checklist">
          <h4>Before travel checklist</h4>
          <div class="participant-checklist-grid">
            <div class="participant-check-item">
              <span id="checkFlight" class="check-state">○</span>
              <span>Flight</span>
            </div>
            <div class="participant-check-item">
              <span id="checkInsurance" class="check-state">○</span>
              <span>Insurance</span>
            </div>
            <div class="participant-check-item">
              <span id="checkReserve" class="check-state">○</span>
              <span>Reserve</span>
            </div>
            <div class="participant-check-item">
              <span id="checkLicense" class="check-state">○</span>
              <span>License</span>
            </div>
          </div>
        </div>
      </section>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="event.js"></script>
</body>
</html>
